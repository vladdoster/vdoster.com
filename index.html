<!-- style-src needs 'unsafe-inline': drag writes element.style.transform and `theme`
     writes a validated hex into a CSS custom property. Removing it breaks dragging.
     script-src deliberately has NO 'unsafe-inline' - the one inline script below is
     allowed by its sha256 hash, and the gtag bootstrap lives in js/analytics.js. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-85utiNApXBiXUrcTA6Tr9KElGKjET82UutCvxCSDoLE=' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://*.analytics.google.com https://www.googletagmanager.com; img-src 'self' data: https://*.google-analytics.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline'; font-src 'self'; base-uri 'none'; form-action 'none'">

<!-- Dropping `no-js` here rather than from main.js avoids a flash of the fallback
     nav, but it is a bet that the module will run. The load handler settles it:
     if main.js (or anything it imports) 404s or fails to parse, nothing in js/
     ever executes, and without this the visitor would get a dead empty terminal
     with the links clipped to 1px. -->
<script>document.documentElement.classList.remove("no-js");addEventListener("load",function(){if(!document.documentElement.dataset.booted)document.documentElement.classList.add("no-js")})</script>

<link rel="preload" as="image" href="./assets/bg.png">
<!-- crossorigin is required even same-origin: fonts always fetch in CORS mode -->
<link rel="preload" as="font" type="font/woff2" crossorigin href="./assets/fonts/ServerMono-Regular.woff2">
<link rel="stylesheet" href="./index.css">
<link rel="icon" href="./assets/favicon.ico" sizes="any">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-DY1J66LGP0"></script>
<script type="module" src="./js/main.js"></script>
</head>

<body>
<h1 class="sr-only">Vlad Doster — vdoster.com</h1>

<!-- Permanent, real anchors. Today every link lives only in a JS string, so crawlers,
     link unfurlers and archive.org see an empty page. This is also what a visitor gets
     with JS off, after a JS error, when the terminal is closed, and on Cmd+P. -->
<nav class="fallback" aria-label="Links">
  <p class="fallback-hint"><span aria-hidden="true">&gt;_</span> vlad@vdoster.com</p>
  <ul>
    <li><a href="https://github.com/vladdoster/">github</a></li>
    <li><a href="https://www.linkedin.com/in/vlad-doster/">linkedin</a></li>
    <li><a href="http://rap-diablo.vdoster.com">music</a></li>
    <li><a href="./keybase.txt">keybase.txt</a></li>
    <li><a href="mailto:mvdoster@gmail.com">mvdoster@gmail.com</a></li>
  </ul>
</nav>

<section id="term" class="term" role="region" aria-label="vdoster.com terminal" tabindex="-1">
  <header class="titlebar" id="term-titlebar" role="toolbar"
          aria-label="Terminal window controls" tabindex="0">
    <div class="lights">
      <button type="button" class="light red" data-act="close" aria-label="Close terminal">
        <svg class="glyph" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M3.5 3.5l5 5M8.5 3.5l-5 5"/></svg>
      </button>
      <button type="button" class="light yellow" data-act="minimize" aria-label="Minimize terminal" aria-pressed="false">
        <svg class="glyph" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path d="M3 6h6"/></svg>
      </button>
      <button type="button" class="light green" data-act="zoom" aria-label="Expand terminal" aria-pressed="false">
        <svg class="glyph" viewBox="0 0 12 12" aria-hidden="true" focusable="false"><path class="g-out" d="M6.5 6.5h2.5M6.5 6.5v2.5M5.5 5.5h-2.5M5.5 5.5v-2.5"/><path class="g-in" d="M8 4h-2.5M8 4v2.5M4 8h2.5M4 8v-2.5"/></svg>
      </button>
    </div>
    <div class="title">vdoster.com</div>
    <div class="title-spacer"></div>
  </header>

  <div class="term-body" id="term-body">
    <div id="term-out" role="log" aria-relevant="additions"></div>
    <form class="prompt-row" id="term-form" autocomplete="off">
      <span class="prompt" id="term-prompt" aria-hidden="true"></span>
      <label class="sr-only" for="term-input">Terminal input</label>
      <input class="cmd" id="term-input" type="text" enterkeyhint="go"
             autocomplete="off" autocorrect="off" autocapitalize="none" spellcheck="false"
             data-1p-ignore data-lpignore="true" maxlength="512">
    </form>
  </div>

  <!-- Touch devices have no Tab and no arrow keys. Populated by chrome.js. -->
  <div class="keybar" id="term-keybar" aria-label="Terminal shortcuts" hidden></div>

  <footer class="statusbar">
    <span class="ctx" id="term-ctx"></span>
    <span class="legend" id="term-legend"></span>
  </footer>
</section>

<button type="button" id="term-reopen" class="reopen">
  <span class="reopen-key" aria-hidden="true">`</span> open terminal
</button>
</body>
</html>
