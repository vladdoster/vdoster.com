name: test

on:
  push:
    branches: [master]
  pull_request:

# Read-only: this workflow never needs to write to the repo.
permissions:
  contents: read

# A newer push to the same branch makes an in-flight run irrelevant.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
          # Nothing to install: the site has no dependencies and no build step.

      # `bun test` discovers test/*.test.mjs on its own, so there is no path
      # argument to get wrong. The suite covers the VFS and command layer, the
      # tokenizer, the navigation scheme allowlist, and the static guards (no
      # HTML sinks, the CSP hash still matches its inline script, the CNAME
      # and keybase proof are intact).
      - name: Run tests
        run: bun test
